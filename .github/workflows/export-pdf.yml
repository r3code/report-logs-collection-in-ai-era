name: Export PDF

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Коммит/ветка для экспорта (по умолчанию main)'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  export-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit || 'main' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate version string
        run: |
          VERSION="$(date -u +%Y%m%d) rev. $(echo ${{ github.sha }} | cut -c1-7)"
          echo "Version: $VERSION"
          sed -i "s/__VERSION__/$VERSION/g" slides.md
          grep -q "$VERSION" slides.md && echo "Version injected OK"

      - name: Install Chromium for Playwright
        # playwright-chromium уже в devDependencies, нужно только скачать binary
        run: pnpm exec playwright install chromium
        continue-on-error: true

      - name: Export slides to PDF
        # --with-clicks — экспортирует все шаги v-click как отдельные страницы
        # --timeout 120000 — 2 минуты на рендеринг (для сложных слайдов с картинками)
        run: pnpm exec slidev export --format pdf --with-clicks --output "Сбор-логов-на-vector-и-clickhouse.pdf" --timeout 120000
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides-pdf
          path: "*.pdf"
          if-no-files-found: error
          retention-days: 30
